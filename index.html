<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AltLigler.com</title>
<meta name="description" content="Türkiye'nin alt ligleri: TFF 1. Lig, 2. Lig ve 3. Lig puan durumları, maç sonuçları, haberler ve kulüp bilgileri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: tribün sesi, yerel gurur; sade ama heyecanlı
   IDEA: hafta sonu çim saha ve tebeşir çizgileri, stat skorbordu
   PICTURE: biçilmiş çim şeritleri, orta saha çizgisi üstünde skor tahtası
   COLOUR and TYPE: çim yeşili zemin, tebeşir beyazı, projektör sarısı; Barlow Condensed başlıklar + Barlow metin
   LAYOUT: tam genişlik saha bandı, altında haber + puan durumu iki sütun, kulüp şeridi, footer */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f2,#0f1a14);--card:light-dark(#ffffff,#16241c);--ink:light-dark(#17201b,#e9efe9);
--mute:light-dark(#5b675f,#9fb0a5);--line:light-dark(#dfe5dd,#26372d);
--pitch:#1d5a3a;--pitch2:#174a30;--chalk:#f3f6f1;--lamp:#f5c518;--up:#2f9e5b;--po:#e0a10f;--down:#c8362d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(28px,4vw,56px) 0}
pre,.scroll{overflow-x:auto}

/* header */
header{background:var(--pitch2);color:var(--chalk);position:sticky;top:0;z-index:20;border-bottom:3px solid var(--lamp)}
.hd{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:2px;text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.5px}
.logo b{color:var(--lamp)}.logo small{font-size:16px;font-weight:500;opacity:.7}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{text-decoration:none;padding:10px 14px;border-radius:6px;font-weight:600;min-height:44px;display:flex;align-items:center}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current=page]{background:var(--lamp);color:#1b1a10}

/* pitch hero */
.pitch{color:var(--chalk);background-color:var(--pitch);
background-image:
 radial-gradient(circle at 50% 50%,transparent 129px,rgba(255,255,255,.16) 130px,rgba(255,255,255,.16) 132px,transparent 133px),
 linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.16) calc(50% - 1px),rgba(255,255,255,.16) calc(50% + 1px),transparent calc(50% + 1px)),
 repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 90px,transparent 90px 180px)}
.pitch h1{font-size:clamp(36px,6vw,64px);font-weight:800;max-width:14ch}
.pitch p.lead{max-width:56ch;opacity:.85;margin:12px 0 24px;font-size:17px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:600 15px Barlow,sans-serif;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--chalk);color:var(--pitch2);border-color:var(--chalk)}
.board{background:rgba(8,22,14,.72);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:6px 0;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.fx:last-child{border-bottom:0}
.fx .t{display:flex;align-items:center;gap:10px;font:700 clamp(17px,2.2vw,22px) "Barlow Condensed",sans-serif;text-decoration:none}
.fx .t:hover span{text-decoration:underline}
.fx .t.r{justify-content:flex-end;text-align:right}
.sc{text-align:center;font:800 28px/1 "Barlow Condensed",sans-serif;color:var(--lamp);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc small{display:block;font:500 12px Barlow,sans-serif;color:var(--chalk);opacity:.7;margin-top:4px}
.sc.up{font-size:20px;color:var(--chalk)}
.note{font-size:13px;opacity:.75;margin-top:12px}

/* crest */
.crest{flex:none;width:30px;height:34px;display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);font:800 10px/1 "Barlow Condensed",sans-serif;letter-spacing:-.3px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.lglogo{width:22px;height:22px;object-fit:contain;flex:none;margin-right:8px;vertical-align:middle}
.lglogo.big{width:34px;height:34px;margin-right:10px}
.tab,.sel button,.lgh{display:inline-flex;align-items:center}
.crest.logo{clip-path:none;object-fit:contain;background:none}
.crest.lg{width:84px;height:96px;font-size:26px}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sh h2{font-size:32px;font-weight:800}
.sh a{font-weight:600;color:var(--mute)}
.lead-story{display:grid;grid-template-columns:minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none}
.ph{aspect-ratio:16/8;position:relative;overflow:hidden}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.lead-story .tx{padding:18px 20px 20px}
.lead-story h3{font-size:clamp(26px,3vw,34px);font-weight:800;margin:6px 0 8px}
.kicker{font-weight:600;font-size:14px;color:var(--up)}
.meta{font-size:14px;color:var(--mute)}
.nl{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:0}
.nl li{border-top:1px solid var(--line)}
.nl a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;text-decoration:none;align-items:center}
.nl .ph{aspect-ratio:4/3;border-radius:8px}
.nl h3{font-size:21px;font-weight:700;margin:2px 0 4px}
.nl a:hover h3,.lead-story:hover h3{text-decoration:underline}

/* table */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0 10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 13px Barlow,sans-serif;color:var(--mute);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pos{width:40px;text-align:center;font-weight:700;border-left:4px solid transparent}
tr.z-up td.pos{border-left-color:var(--up)}tr.z-po td.pos{border-left-color:var(--po)}tr.z-down td.pos{border-left-color:var(--down)}
td.tm a{display:flex;align-items:center;gap:8px;font-weight:600;text-decoration:none}
td.tm a:hover{text-decoration:underline}
td.pts{font-weight:800;font-family:"Barlow Condensed",sans-serif;font-size:19px}
.form{display:inline-flex;gap:3px}
.form i{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font:700 11px Barlow,sans-serif;font-style:normal;color:#fff}
.form .G{background:var(--up)}.form .B{background:#8a958d}.form .M{background:var(--down)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);padding:12px 16px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.mini td,.mini th{padding:8px 10px}
.sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sel button{font:600 15px Barlow,sans-serif;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.sel button[aria-pressed=true]{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}

/* clubs */
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.club{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;min-height:72px}
.club:hover{border-color:var(--pitch)}
.club b{display:block;font:700 20px "Barlow Condensed",sans-serif}
.club span{font-size:14px;color:var(--mute)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.strip .club{flex:none;width:220px}
.search{width:100%;max-width:420px;font:16px Barlow,sans-serif;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;margin-bottom:16px}
.empty{padding:28px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px}

/* club page */
.chero{color:var(--chalk);padding:clamp(28px,4vw,48px) 0}
.chero .in{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.chero h1{font-size:clamp(36px,6vw,56px);font-weight:800}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:28px}
.facts div{background:var(--card);padding:14px 16px}
.facts dt{font-size:13px;color:var(--mute)}.facts dd{margin:2px 0 0;font:700 22px "Barlow Condensed",sans-serif}

/* article */
article{max-width:720px}
article h1{font-size:clamp(32px,5vw,48px);font-weight:800;margin:8px 0 12px}
article p{font-size:17px;margin:0 0 16px}
article .ph{border-radius:14px;margin:20px 0}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--mute)}

footer{background:var(--pitch2);color:var(--chalk);margin-top:40px;padding:36px 0;font-size:15px}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}
footer p{margin:6px 0 0;opacity:.75;max-width:48ch}
.demo{font-size:13px;color:var(--mute);margin-top:10px}

@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
 .hd{gap:4px;padding-block:6px}nav{margin-left:0;width:100%}nav a{padding:8px 10px;font-size:15px}
 .fx{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);padding:10px 12px;gap:8px}
 .fx .t{font-size:16px;gap:6px}.fx .crest{display:none}.sc{font-size:22px}
 .nl a{grid-template-columns:72px minmax(0,1fr)}.nl h3{font-size:18px}
 table{font-size:14px}.hide-s{display:none}
}
@media(prefers-reduced-motion:no-preference){.board .fx{animation:in .5s ease-out both}.board .fx:nth-child(2){animation-delay:.06s}.board .fx:nth-child(3){animation-delay:.12s}.board .fx:nth-child(4){animation-delay:.18s}.board .fx:nth-child(5){animation-delay:.24s}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
</style>
</head>

/* ======================= VERİLER SONU ======================= */

const CLUBS={};
for(const L of LEAGUES)for(const r of L.table){const d=C[r[0]];CLUBS[r[0]]={id:r[0],name:d[0],short:d[1],city:d[2]||"",stadium:d[3]||"",c1:d[4]||"#1d5a3a",c2:d[5]||"#f3f6f1",logo:d[6]||"",league:L.id}}
const $=s=>document.querySelector(s),app=$("#app");
const club=id=>CLUBS[id],league=id=>LEAGUES.find(l=>l.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shield=(c,lg)=>`<span class="crest${lg?" lg":""}" style="background:linear-gradient(135deg,${c.c1} 50%,${c.c2} 50%)" aria-hidden="true">${esc(c.short)}</span>`;
// Logo: "logolar/<kulüp-id>.png" dosyası varsa o gösterilir, yoksa renkli kalkana döner.
const logoSrc=c=>{const f=LOGOS[c.id]||c.logo||"";return !f?"":/^(https?:|\/)/.test(f)||f.includes("/")?f:LOGO_DIR+f};
const lgLogo=(L,big)=>L.logo?`<img class="lglogo${big?" big":""}" src="${esc(/\//.test(L.logo)?L.logo:LOGO_DIR+L.logo)}" alt="" onerror="this.remove()">`:"";
const crest=(c,lg)=>!logoSrc(c)?shield(c,lg):`<img class="crest logo${lg?" lg":""}" src="${esc(logoSrc(c))}" alt="" data-id="${c.id}" data-lg="${lg?1:""}" onerror="window.__noLogo&&window.__noLogo(this)">`;
window.__noLogo=img=>{const c=club(img.dataset.id);if(!c)return;if(c.apiLogo&&img.getAttribute("src")!==c.apiLogo){img.src=c.apiLogo;return}img.outerHTML=shield(c,img.dataset.lg)};
function rows(lid){return league(lid).table.map(([id,p,w,d,l,gf,ga,pen=0])=>({c:club(id),p,w,d,l,gf,ga,pen,gd:gf-ga,pts:w*3+d-pen}))}
function zone(L,i,n){if(L.rowZones){const r=L.rowZones[i];return r?"z-"+r:""}const z=L.zones;if(i<z.up)return"z-up";if(i+1>=z.po[0]&&i+1<=z.po[1])return"z-po";if(z.down&&i>=n-z.down)return"z-down";return""}

function art(c,seed){
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
  const c1=c?c.c1:"#1d5a3a",c2=c?c.c2:"#f5c518";let flags="";
  for(let i=0;i<14;i++){const x=10+i*45+r()*10,hh=40+r()*30;flags+=`<rect x="${x}" y="${150-hh}" width="26" height="${hh}" fill="${i%2?c1:c2}" opacity=".9"/>`}
  return `<svg viewBox="0 0 640 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="640" height="320" fill="${c1}"/><rect width="640" height="170" fill="#0e1a12" opacity=".55"/>${flags}<rect y="150" width="640" height="24" fill="#0e1a12" opacity=".7"/><rect y="174" width="640" height="146" fill="#1d5a3a"/>${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${i*80}" y="174" width="40" height="146" fill="#fff" opacity=".04"/>`).join("")}<ellipse cx="320" cy="250" rx="110" ry="34" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><line x1="0" y1="250" x2="640" y2="250" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><circle cx="${200+r()*240}" cy="${235+r()*30}" r="9" fill="#fff"/><circle cx="560" cy="40" r="22" fill="#f5c518" opacity=".9"/></svg>`;
}

function board(lid){
  const L=league(lid);
  return `<div class="tabs" role="tablist">${LEAGUES.map(l=>`<button class="tab" role="tab" data-l="${l.id}" aria-selected="${l.id===lid}">${lgLogo(l)}${l.short}</button>`).join("")}</div>
  <div class="board" aria-label="${esc(L.name)} sonuçları">${L.results.length?"":`<div class="fx" style="grid-template-columns:1fr"><span class="sc up" style="text-align:center">Son 7 günde oynanmış maç yok</span></div>`}${L.results.map(([h,hs,as,a])=>{const H=club(h),A=club(a);return `<div class="fx">
    <a class="t" href="#kulup-${H.id}">${crest(H)}<span>${esc(H.name)}</span></a>
    <div class="sc">${hs} – ${as}<small>Maç sonu</small></div>
    <a class="t r" href="#kulup-${A.id}"><span>${esc(A.name)}</span>${crest(A)}</a></div>`}).join("")}</div>
  <p class="note">${esc(L.name)}${L.week?`, ${L.week}. hafta`:", son 7 gün"}. Kaynak: ${/^http/.test(L.src)?`<a href="${L.src}">TFF</a>`:"API-Football"}.</p>`;
}
function standHead(lid){const L=league(lid);return `<h3 class="lgh" style="font-size:28px;margin:4px 0 14px">${lgLogo(L,1)}${esc(L.name)}${L.week?`, ${L.week}. hafta`:""}</h3>`}
function stand(lid,mini){
  const L=league(lid),rs=rows(lid),n=rs.length,list=mini?rs.slice(0,6):rs,pens=rs.filter(x=>x.pen>0);
  const z=L.rowZones?{up:L.rowZones.includes("up"),po:[0,+L.rowZones.includes("po")],down:L.rowZones.includes("down")}:L.zones;
  const leg=[z.up?`<span style="--c:var(--up)">${L.id==="superlig"?"Avrupa kupaları":"Doğrudan üst lig"}</span>`:"",z.po[1]?`<span style="--c:var(--po)">Play-off</span>`:"",z.down?`<span style="--c:var(--down)">Küme düşme</span>`:""].join("");
  return `<div class="panel ${mini?"mini":""}"><div class="scroll"><table>
  <thead><tr><th style="text-align:center">#</th><th class="l">Takım</th><th>O</th>${mini?"":`<th class="hide-s">G</th><th class="hide-s">B</th><th class="hide-s">M</th><th class="hide-s">A</th><th class="hide-s">Y</th>`}<th>Av</th><th>P</th></tr></thead>
  <tbody>${list.map((x,i)=>`<tr class="${zone(L,i,n)}"><td class="pos">${i+1}</td><td class="l tm"><a href="#kulup-${x.c.id}">${crest(x.c)}${esc(x.c.name)}${x.pen>0?"*":""}</a></td><td>${x.p}</td>
  ${mini?"":`<td class="hide-s">${x.w}</td><td class="hide-s">${x.d}</td><td class="hide-s">${x.l}</td><td class="hide-s">${x.gf}</td><td class="hide-s">${x.ga}</td>`}<td>${x.gd>0?"+":""}${x.gd}</td><td class="pts">${x.pts}</td></tr>`).join("")}</tbody></table></div>
  ${mini?"":`<div class="legend">${leg}</div>${pens.length?`<p class="demo" style="padding:0 16px">* Ceza puanı silinen takımlar: ${pens.map(x=>`${esc(x.c.name)} (${x.pen})`).join(", ")}.</p>`:""}${L.note?`<p class="demo" style="padding:0 16px">${esc(L.note)}</p>`:""}`}</div>`;
}
const newsItem=n=>`<li><a href="#haber-${n.id}"><div class="ph">${art(club(n.club),n.id)}</div><div><span class="kicker">${esc(n.tag)}</span><h3>${esc(n.title)}</h3><span class="meta">${esc((league(n.league)||{}).short||"")}, ${esc(n.date)}</span></div></a></li>`;
const clubCard=c=>`<a class="club" href="#kulup-${c.id}">${crest(c)}<div><b>${esc(c.name)}</b><span>${c.city?esc(c.city)+", ":""}${esc(league(c.league).short)}</span></div></a>`;
const srcLine=()=>`<p class="demo">Veriler ${SOURCE==="TFF"?"TFF'nin resmi puan cetvellerinden":"API-Football'dan"} alınmıştır, ${esc(UPDATED)} itibarıyla.</p>`;

let boardLeague="1lig",standLeague="1lig";
const views={
 ana(){
  const lead=NEWS[0];
  return `<section class="pitch band"><div class="wrap">
   <h1>Hafta sonu sahada ne oldu?</h1>
   <p class="lead">1. Lig'den 3. Lig'e, Türkiye'nin alt liglerinden sonuçlar, puan durumları ve kulüp haberleri.</p>
   <div id="board">${board(boardLeague)}</div></div></section>
  <section class="band"><div class="wrap cols">
   <div><div class="sh"><h2>Son haberler</h2><a href="#haberler">Tüm haberler</a></div>
    <a class="lead-story" href="#haber-${lead.id}"><div class="ph">${art(club(lead.club),lead.id)}</div><div class="tx"><span class="kicker">${esc(lead.tag)}</span><h3>${esc(lead.title)}</h3><span class="meta">${esc(league(lead.league).short)}, ${esc(lead.date)}</span></div></a>
    <ul class="nl">${NEWS.slice(1,4).map(newsItem).join("")}</ul></div>
   <aside><div class="sh"><h2 class="lgh">${lgLogo(league("1lig"),1)}1. Lig zirvesi</h2><a href="#puan">Tam tablo</a></div>${stand("1lig",true)}
    <div class="sh" style="margin-top:28px"><h2>Grup liderleri</h2><a href="#kulupler">Tüm kulüpler</a></div>
    <div class="clubs" style="grid-template-columns:minmax(0,1fr)">${LEAGUES.filter(l=>l.id!=="1lig"&&l.id!=="superlig"&&l.table.length).map(l=>clubCard(club(l.table[0][0]))).join("")}</div></aside>
  </div></section>`;
 },
 puan(){
  return `<section class="band"><div class="wrap"><div class="sh"><h2 style="font-size:44px">Puan durumu</h2></div>
   <div class="sel" id="sel">${LEAGUES.map(l=>`<button data-l="${l.id}" aria-pressed="${l.id===standLeague}">${lgLogo(l)}${l.name}</button>`).join("")}</div>
   <div id="tbl">${standHead(standLeague)}${stand(standLeague)}</div>${srcLine()}</div></section>`;
 },
 haberler(){
  return `<section class="band"><div class="wrap" style="max-width:900px"><div class="sh"><h2 style="font-size:44px">Haberler</h2></div>
   <div class="sel" id="nsel"><button data-l="" aria-pressed="true">Tümü</button>${LEAGUES.map(l=>`<button data-l="${l.id}" aria-pressed="false">${lgLogo(l)}${l.short}</button>`).join("")}</div>
   <ul class="nl" id="nlist">${NEWS.map(newsItem).join("")}</ul></div></section>`;
 },
 kulupler(){
  return `<section class="band"><div class="wrap"><div class="sh"><h2 style="font-size:44px">Kulüpler</h2></div>
   <label for="q" class="meta">Kulüp ya da şehir ara</label><br><input id="q" class="search" type="search" placeholder="Örneğin Bolu, Ordu" autocomplete="off">
   <div id="clist">${clubsByLeague("")}</div></div></section>`;
 },
 kulup(id){
  const c=club(id);if(!c)return notFound();
  const L=league(c.league),rs=rows(c.league),i=rs.findIndex(x=>x.c.id===id),x=rs[i];
  const res=L.results.find(r=>r[0]===id||r[3]===id);
  const rel=NEWS.filter(n=>n.club===id).concat(NEWS.filter(n=>n.club!==id&&n.league===c.league)).slice(0,3);
  const dark=c.c2.toLowerCase()==="#ffffff"||c.c2==="#f3f6f1"?"#1d5a3a":c.c2;
  return `<section class="chero" style="background:linear-gradient(120deg,${c.c1} 0 55%,${dark} 55%)"><div class="wrap in">${crest(c,1)}
   <div><h1 style="text-shadow:0 2px 8px rgba(0,0,0,.35)">${esc(c.name)}</h1><p style="margin:6px 0 0;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4)">${c.city?esc(c.city)+", ":""}${esc(L.name)}</p></div></div></section>
   <section class="band"><div class="wrap">
   <dl class="facts">${c.founded?`<div><dt>Kuruluş</dt><dd>${c.founded}</dd></div>`:""}<div><dt>Sıralama</dt><dd>${i+1}. sıra</dd></div><div><dt>Puan</dt><dd>${x.pts}${x.pen>0?` <small style="font-size:14px">(${x.pen} ceza)</small>`:""}</dd></div>
   <div><dt>G-B-M</dt><dd>${x.w}-${x.d}-${x.l}</dd></div><div><dt>Gol (A:Y)</dt><dd>${x.gf}:${x.ga}</dd></div>
   ${c.stadium?`<div><dt>Stadyum</dt><dd style="font-size:18px">${esc(c.stadium)}</dd></div>`:""}
   ${res?`<div><dt>${L.week?L.week+". hafta":"Son maç"}</dt><dd style="font-size:18px">${esc(club(res[0]).short)} ${res[1]}-${res[2]} ${esc(club(res[3]).short)}</dd></div>`:""}</dl>
   <div class="cols"><div><div class="sh"><h2>İlgili haberler</h2></div>${rel.length?`<ul class="nl">${rel.map(newsItem).join("")}</ul>`:`<div class="empty">Bu kulüp hakkında henüz haber yok.</div>`}</div>
   <aside><div class="sh"><h2 class="lgh">${lgLogo(L,1)}${esc(L.short)}</h2><a href="#puan" data-std="${L.id}">Tam tablo</a></div>${stand(c.league,true)}</aside></div>${srcLine()}</div></section>`;
 },
 haber(id){
  const n=NEWS.find(n=>n.id===id);if(!n)return notFound();const c=club(n.club);
  return `<section class="band"><div class="wrap"><a class="back" href="#haberler">Haberlere dön</a><article>
   <span class="kicker">${esc(n.tag)}, ${esc((league(n.league)||{}).name||"")}</span><h1>${esc(n.title)}</h1><span class="meta">${esc(n.date)}</span>
   <div class="ph">${art(c,n.id)}</div>${n.body.map(p=>`<p>${esc(p)}</p>`).join("")}
   <p class="meta">Kaynak: <a href="${esc(n.src)}">${esc(n.srcName)}</a></p>
   ${c?`<p><a href="#kulup-${c.id}" class="club" style="display:inline-flex">${crest(c)}<span><b>${esc(c.name)}</b>Kulüp sayfasına git</span></a></p>`:""}</article></div></section>`;
 }
};
function clubsByLeague(q){
  q=q.trim().toLocaleLowerCase("tr");
  const out=LEAGUES.map(l=>{const cs=l.table.map(r=>club(r[0])).filter(c=>!q||(c.name+" "+c.city).toLocaleLowerCase("tr").includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"tr"));
    return cs.length?`<h3 class="lgh" style="font-size:24px;margin:24px 0 12px">${lgLogo(l,1)}${esc(l.name)}</h3><div class="clubs">${cs.map(clubCard).join("")}</div>`:""}).join("");
  return out||`<div class="empty">"${esc(q)}" ile eşleşen kulüp bulunamadı. Farklı bir kulüp ya da şehir adı deneyin.</div>`;
}
function notFound(){return `<section class="band"><div class="wrap"><div class="empty">Aradığınız sayfa bulunamadı. <a href="#ana">Ana sayfaya dönün</a>.</div></div></section>`}

function route(keep){
  const h=(location.hash||"#ana").slice(1),m=h.match(/^(kulup|haber)-(.+)$/);
  const key=m?m[1]:(views[h]?h:"ana");
  app.innerHTML=m?views[key](m[2]):views[key]();
  const sect=key==="kulup"?"kulupler":key==="haber"?"haberler":key;
  document.querySelectorAll("#nav a").forEach(a=>{a.getAttribute("href")==="#"+sect?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  if(!keep)window.scrollTo(0,0);
}
app.addEventListener("click",e=>{
  const d=e.target.closest("[data-std]");if(d)standLeague=d.dataset.std;
  const t=e.target.closest(".tab");if(t){boardLeague=t.dataset.l;$("#board").innerHTML=board(boardLeague);$(`.tab[data-l="${boardLeague}"]`).focus();return}
  const s=e.target.closest("#sel button");if(s){standLeague=s.dataset.l;document.querySelectorAll("#sel button").forEach(b=>b.setAttribute("aria-pressed",b===s));$("#tbl").innerHTML=standHead(standLeague)+stand(standLeague);return}
  const n=e.target.closest("#nsel button");if(n){document.querySelectorAll("#nsel button").forEach(b=>b.setAttribute("aria-pressed",b===n));
    const list=NEWS.filter(x=>!n.dataset.l||x.league===n.dataset.l);$("#nlist").innerHTML=list.length?list.map(newsItem).join(""):`<li><div class="empty">Bu ligde henüz haber yok.</div></li>`}
});
app.addEventListener("input",e=>{if(e.target.id==="q")$("#clist").innerHTML=clubsByLeague(e.target.value)});
addEventListener("hashchange",()=>route());route();
/* ===== API verisi: veri/data.json varsa (GitHub'daki otomatik güncelleme yazar) onu kullan ===== */
const slug=s=>String(s||"").toLocaleLowerCase("tr").replace(/[çğıöşüâîû]/g,ch=>({ç:"c",ğ:"g",ı:"i",ö:"o",ş:"s",ü:"u",â:"a",î:"i",û:"u"}[ch])).normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const STOP=new Set(["fk","sk","fsk","as","a","s","futbol","kulubu","spor","jk","sporu"]);
const toks=s=>slug(s).split("-").filter(t=>t&&!STOP.has(t));
function sim(a,b){if(slug(a)===slug(b))return 100;const ca=slug(a).replace(/-/g,""),cb=slug(b).replace(/-/g,"");if(ca===cb)return 95;if(Math.min(ca.length,cb.length)>=6&&(ca.endsWith(cb)||cb.endsWith(ca)))return 80;const A=toks(a),B=toks(b);if(!A.length||!B.length)return 0;const SA=new Set(A),SB=new Set(B);
  const inter=A.filter(t=>SB.has(t)).length;if(inter===Math.min(SA.size,SB.size))return 50+inter*5-Math.abs(SA.size-SB.size);return 0}
function best(name,list,get){let top=null,sc=49;for(const x of list){const v=sim(name,get(x));if(v>sc){sc=v;top=x}}return top}
const LEAGUE_LOGO={superlig:"super-lig.png","1lig":"1st-lig.png","2lig":"2nd-lig.png","3lig":""};
function applyLogos(d){
  const list=Object.values((d&&d.teamLogos)||{}).filter(x=>x&&x.logo&&x.name);if(!list.length)return false;
  for(const c of Object.values(CLUBS)){const m=best(c.name,list,x=>x.name);if(!m)continue;c.apiLogo=m.logo;if(!LOGOS[c.id]&&!c.logo)c.logo=m.logo}
  return true}
function applyApi(d){
  if(!d||!Array.isArray(d.tables)||!d.tables.length)return applyLogos(d);
  const inline=Object.keys(C).map(id=>({id,name:C[id][0]})),used=new Set(),byApi={},teamInfo=d.teams||{},files=d.logos||[];
  for(const k in CLUBS)delete CLUBS[k];
  const mk=(tid,name,lid)=>{
    if(byApi[tid])return byApi[tid];
    const m=best(name,inline.filter(x=>!used.has(x.id)),x=>x.name),info=teamInfo[tid]||{};
    let id,o;
    if(m){used.add(m.id);const r=C[m.id];id=m.id;o={id,name:r[0],short:r[1],city:r[2]||info.city||"",stadium:r[3]||info.stadium||"",c1:r[4]||"#1d5a3a",c2:r[5]||"#f3f6f1",logo:r[6]||""}}
    else{id="t"+tid;o={id,name,short:(name.split(" ")[0]||name).slice(0,3).toLocaleUpperCase("tr"),city:info.city||"",stadium:info.stadium||"",c1:"#1d5a3a",c2:"#f3f6f1",logo:""}}
    if(!LOGOS[id]&&!o.logo){const f=best(name,files,f=>f.replace(/\.[a-z]+$/i,""));o.logo=f||info.logo||""}
    o.apiLogo=info.logo||"";
    o.founded=info.founded||null;o.league=lid;CLUBS[id]=o;byApi[tid]=id;return id};
  const L2=d.tables.map(t=>{
    const key=t.id.split("-")[0],rows=t.table.map(r=>{const id=mk(r.teamId,r.team,t.id);return [id,r.p,r.w,r.d,r.l,r.gf,r.ga,r.w*3+r.d-r.pts]});
    return {id:t.id,name:t.name,short:t.short,logo:LEAGUE_LOGO[key]||t.leagueLogo||"",week:t.week,src:t.src||"API-Football",rowZones:t.table.map(r=>r.zone||""),zones:{up:0,po:[0,0],down:0},table:rows,
      results:t.results.map(f=>[mk(f.homeId,f.home,t.id),f.hs,f.as,mk(f.awayId,f.away,t.id)])}});
  LEAGUES.length=0;LEAGUES.push(...L2.sort((a,b)=>(a.id==="superlig"?-1:0)-(b.id==="superlig"?-1:0)));
  const [dt,tm]=String(d.updated||"").split(" "),[y,mo,da]=(dt||"").split("-");
  SOURCE=d.source==="TFF"?"TFF":"API";UPDATED=y?`${+da} ${["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][mo-1]} ${y} ${tm||""}`.trim():UPDATED;
  if(!league(boardLeague))boardLeague=LEAGUES[0].id;if(!league(standLeague))standLeague=LEAGUES[0].id;
  applyLogos(d);return true}
fetch("veri/data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(applyApi(d))route(true)}).catch(()=>{});

}
