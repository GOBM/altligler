name: Veri güncelle

on:
  schedule:
    - cron: "47 20 * * *"   # her gün 23:47 (Türkiye saati)
  workflow_dispatch:         # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API-Football'dan verileri çek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/guncelle.py

      - name: Değiştiyse kaydet
        run: |
          git config user.name "altligler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/data.json
          if git diff --cached --quiet; then
            echo "Veride değişiklik yok."
          else
            git commit -m "Veri güncellendi: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            git push
          fi
